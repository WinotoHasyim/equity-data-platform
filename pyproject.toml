[project]
name = "alpaca-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WinotoHasyim", email = "hasyimwinoto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[project.scripts]
alpaca-pipeline = "alpaca_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.16.10",
]
