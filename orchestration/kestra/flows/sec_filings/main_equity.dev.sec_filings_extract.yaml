id: sec_filings_extract
namespace: equity.dev

description: Extract SEC EDGAR filing metadata and publish an immutable raw batch.

inputs:
  - id: start_date
    type: DATE
  - id: end_date
    type: DATE
  - id: symbols
    type: ARRAY
    itemType: STRING
    required: false

tasks:
  - id: extract_sec_filings
    type: io.kestra.plugin.scripts.shell.Commands
    timeout: PT30M
    containerImage: "{{ kv('PIPELINE_IMAGE') }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      user: root
    env:
      APCA_API_KEY_ID: "{{ secret('APCA_API_KEY_ID') }}"
      APCA_API_SECRET_KEY: "{{ secret('APCA_API_SECRET_KEY') }}"
      SEC_USER_AGENT: "{{ secret('SEC_USER_AGENT') }}"
      START_DATE: "{{ inputs.start_date }}"
      END_DATE: "{{ inputs.end_date }}"
      BATCH_SYMBOLS: "{{ inputs.symbols ?? [] }}"
      BATCH_RUN_ID: "{{ execution.id }}"
    commands:
      - |
        python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        run_id = os.environ["BATCH_RUN_ID"]
        batch_path = Path("sec_filings") / f"run_id={run_id}"
        command = [
            "/app/.venv/bin/equity-ingest",
            "sec-filings",
            "--start-date", os.environ["START_DATE"],
            "--end-date", os.environ["END_DATE"],
            "--run-id", run_id,
            "--output-dir", ".",
        ]
        raw_symbols = os.environ.get("BATCH_SYMBOLS", "").strip()
        symbols = [] if raw_symbols in {"", "null"} else json.loads(raw_symbols)
        if not isinstance(symbols, list):
            raise TypeError("BATCH_SYMBOLS must decode to a JSON array")
        for symbol in symbols:
            command.extend(["--symbol", symbol])
        subprocess.run(command, check=True)
        manifest_path = batch_path / "manifest.json"
        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        part_names = sorted(path.name for path in batch_path.glob("part-*.parquet"))
        manifest_parts = sorted(item["path"] for item in manifest["files"])
        if manifest["run_id"] != run_id or part_names != manifest_parts:
            raise RuntimeError("SEC files do not match the completion manifest")
        output = {"outputs": {
            "batch_path": str(batch_path),
            "has_parquet": bool(part_names),
            "manifest_key": str(manifest_path),
            "part_names": part_names,
            "row_count": manifest["row_count"],
        }}
        print(f"::{json.dumps(output, separators=(',', ':'))}::")
        PY
    outputFiles:
      - "sec_filings/run_id={{ execution.id }}/*"

  - id: upload_parts_if_present
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.extract_sec_filings.vars.has_parquet }}"
    then:
      - id: upload_parts
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{ outputs.extract_sec_filings.vars.part_names }}"
        concurrencyLimit: 4
        tasks:
          - id: upload_part
            type: io.kestra.plugin.gcp.gcs.Upload
            timeout: PT10M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 4
              maxDuration: PT45M
              warningOnRetry: true
            projectId: "{{ kv('GCP_PROJECT_ID') }}"
            from: "{{ outputs.extract_sec_filings.outputFiles[outputs.extract_sec_filings.vars.batch_path ~ '/' ~ taskrun.value] }}"
            to: "gs://{{ kv('GCS_RAW_BUCKET') }}/source=sec_edgar/dataset=filings/batch_start={{ inputs.start_date }}/batch_end={{ inputs.end_date }}/run_id={{ execution.id }}/{{ taskrun.value }}"

  - id: upload_manifest
    type: io.kestra.plugin.gcp.gcs.Upload
    timeout: PT10M
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 4
      maxDuration: PT45M
      warningOnRetry: true
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    from: "{{ outputs.extract_sec_filings.outputFiles[outputs.extract_sec_filings.vars.manifest_key] }}"
    to: "gs://{{ kv('GCS_RAW_BUCKET') }}/source=sec_edgar/dataset=filings/batch_start={{ inputs.start_date }}/batch_end={{ inputs.end_date }}/run_id={{ execution.id }}/manifest.json"

  - id: log_published_batch
    type: io.kestra.plugin.core.log.Log
    message: |
      Published {{ outputs.extract_sec_filings.vars.row_count }} SEC filing records.
      Manifest: {{ outputs.upload_manifest.uri }}

errors:
  - id: log_extract_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      SEC filing extraction or GCS publication failed in execution {{ execution.id }}.
      A missing manifest means the GCS prefix must not be consumed.

outputs:
  - id: extract_run_id
    type: STRING
    value: "{{ (tasks.extract_sec_filings.state | default('FAILED')) == 'SUCCESS' ? execution.id : '' }}"
  - id: has_parquet
    type: BOOLEAN
    value: "{{ (tasks.extract_sec_filings.state | default('FAILED')) == 'SUCCESS' ? outputs.extract_sec_filings.vars.has_parquet : false }}"
  - id: row_count
    type: INT
    value: "{{ (tasks.extract_sec_filings.state | default('FAILED')) == 'SUCCESS' ? outputs.extract_sec_filings.vars.row_count : 0 }}"
  - id: parquet_uri
    type: STRING
    value: "{{ (tasks.extract_sec_filings.state | default('FAILED')) == 'SUCCESS' ? 'gs://' ~ kv('GCS_RAW_BUCKET') ~ '/source=sec_edgar/dataset=filings/batch_start=' ~ inputs.start_date ~ '/batch_end=' ~ inputs.end_date ~ '/run_id=' ~ execution.id ~ '/part-*.parquet' : '' }}"
  - id: manifest_uri
    type: STRING
    value: "{{ (tasks.upload_manifest.state | default('FAILED')) == 'SUCCESS' ? outputs.upload_manifest.uri : '' }}"
