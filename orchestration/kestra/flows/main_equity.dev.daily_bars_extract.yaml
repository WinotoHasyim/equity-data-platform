id: daily_bars_extract
namespace: equity.dev

description: |
  Extract validated Alpaca daily bars and publish an immutable Parquet batch
  plus its completion manifest to the configured raw GCS bucket.

inputs:
  - id: start_date
    type: DATE
    description: Inclusive extraction start date.

  - id: end_date
    type: DATE
    description: Inclusive extraction end date.

  - id: symbols
    type: ARRAY
    itemType: STRING
    required: false
    description: |
      Optional company-stock-symbol override. An empty value makes the CLI use
      the symbols from ingestion/config.toml packaged in the pipeline image.

tasks:
  - id: extract_daily_bars
    type: io.kestra.plugin.scripts.shell.Commands
    timeout: PT30M
    containerImage: "{{ kv('PIPELINE_IMAGE') }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      user: root
    env:
      APCA_API_KEY_ID: "{{ secret('APCA_API_KEY_ID') }}"
      APCA_API_SECRET_KEY: "{{ secret('APCA_API_SECRET_KEY') }}"
      BATCH_END_DATE: "{{ inputs.end_date }}"
      BATCH_RUN_ID: "{{ execution.id }}"
      BATCH_START_DATE: "{{ inputs.start_date }}"
      BATCH_SYMBOLS: "{{ inputs.symbols ?? [] }}"
    commands:
      - |
        python - <<'PY'
        import json
        import os
        import subprocess
        from pathlib import Path

        run_id = os.environ["BATCH_RUN_ID"]
        batch_path = Path("daily_bars") / f"run_id={run_id}"
        command = [
            "/app/.venv/bin/equity-ingest",
            "daily-bars",
            "--start-date",
            os.environ["BATCH_START_DATE"],
            "--end-date",
            os.environ["BATCH_END_DATE"],
            "--run-id",
            run_id,
            "--output-dir",
            ".",
        ]
        raw_symbols = os.environ.get("BATCH_SYMBOLS", "").strip()
        symbols = [] if raw_symbols in {"", "null"} else json.loads(raw_symbols)
        if not isinstance(symbols, list):
            raise TypeError("BATCH_SYMBOLS must decode to a JSON array")
        for symbol in symbols:
            command.extend(["--symbol", symbol])

        subprocess.run(command, check=True)

        manifest_path = batch_path / "manifest.json"
        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        if manifest["run_id"] != run_id:
            raise RuntimeError("Manifest run_id does not match the Kestra execution")

        part_names = sorted(path.name for path in batch_path.glob("part-*.parquet"))
        manifest_parts = sorted(file["path"] for file in manifest["files"])
        if part_names != manifest_parts:
            raise RuntimeError("Manifest file list does not match extracted Parquet files")

        output = {
            "outputs": {
                "batch_path": str(batch_path),
                "effective_symbols": manifest["requested_symbols"],
                "has_parquet": bool(part_names),
                "manifest_key": str(batch_path / "manifest.json"),
                "part_names": part_names,
                "requested_end_date": manifest["requested_end_date"],
                "requested_start_date": manifest["requested_start_date"],
                "row_count": manifest["row_count"],
            }
        }
        print(f"::{json.dumps(output, separators=(',', ':'))}::")
        PY
    outputFiles:
      - "daily_bars/run_id={{ execution.id }}/*"

  - id: upload_parts_if_present
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.extract_daily_bars.vars.has_parquet }}"
    then:
      - id: upload_parquet_parts
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{ outputs.extract_daily_bars.vars.part_names }}"
        concurrencyLimit: 4
        tasks:
          - id: upload_part
            type: io.kestra.plugin.gcp.gcs.Upload
            timeout: PT10M
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 4
              # Four attempts can each consume the 10-minute task timeout.
              maxDuration: PT45M
              warningOnRetry: true
            projectId: "{{ kv('GCP_PROJECT_ID') }}"
            from: "{{ outputs.extract_daily_bars.outputFiles[outputs.extract_daily_bars.vars.batch_path ~ '/' ~ taskrun.value] }}"
            to: "gs://{{ kv('GCS_RAW_BUCKET') }}/daily_bars/batch_start={{ inputs.start_date }}/batch_end={{ inputs.end_date }}/run_id={{ execution.id }}/{{ taskrun.value }}"

  - id: upload_manifest
    type: io.kestra.plugin.gcp.gcs.Upload
    timeout: PT10M
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 4
      # Four attempts can each consume the 10-minute task timeout.
      maxDuration: PT45M
      warningOnRetry: true
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    from: "{{ outputs.extract_daily_bars.outputFiles[outputs.extract_daily_bars.vars.manifest_key] }}"
    to: "gs://{{ kv('GCS_RAW_BUCKET') }}/daily_bars/batch_start={{ inputs.start_date }}/batch_end={{ inputs.end_date }}/run_id={{ execution.id }}/manifest.json"

  - id: log_published_batch
    type: io.kestra.plugin.core.log.Log
    message: |
      Published daily-bars batch for {{ inputs.start_date }} through {{ inputs.end_date }}.
      Rows: {{ outputs.extract_daily_bars.vars.row_count }}
      Effective symbols: {{ outputs.extract_daily_bars.vars.effective_symbols }}
      Manifest: {{ outputs.upload_manifest.uri }}

errors:
  - id: log_extract_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      Daily-bars extraction or GCS publication failed in execution {{ execution.id }}.
      A missing manifest means the GCS prefix must not be consumed.

outputs:
  - id: extract_run_id
    type: STRING
    value: "{{ (tasks.extract_daily_bars.state | default('FAILED')) == 'SUCCESS' ? execution.id : '' }}"

  - id: has_parquet
    type: BOOLEAN
    value: "{{ (tasks.extract_daily_bars.state | default('FAILED')) == 'SUCCESS' ? outputs.extract_daily_bars.vars.has_parquet : false }}"

  - id: manifest_uri
    type: STRING
    value: "{{ (tasks.upload_manifest.state | default('FAILED')) == 'SUCCESS' ? outputs.upload_manifest.uri : '' }}"

  - id: parquet_uri
    type: STRING
    value: "{{ (tasks.extract_daily_bars.state | default('FAILED')) == 'SUCCESS' ? 'gs://' ~ kv('GCS_RAW_BUCKET') ~ '/daily_bars/batch_start=' ~ outputs.extract_daily_bars.vars.requested_start_date ~ '/batch_end=' ~ outputs.extract_daily_bars.vars.requested_end_date ~ '/run_id=' ~ execution.id ~ '/part-*.parquet' : '' }}"

  - id: row_count
    type: INT
    value: "{{ (tasks.extract_daily_bars.state | default('FAILED')) == 'SUCCESS' ? outputs.extract_daily_bars.vars.row_count : 0 }}"

  - id: effective_symbols
    type: ARRAY
    value: "{{ (tasks.extract_daily_bars.state | default('FAILED')) == 'SUCCESS' ? outputs.extract_daily_bars.vars.effective_symbols : [] }}"
