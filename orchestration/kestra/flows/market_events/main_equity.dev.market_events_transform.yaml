id: market_events_transform
namespace: equity.dev

description: Build and test canonical historical trades or quotes.

inputs:
  - id: event_type
    type: SELECT
    values: [trades, quotes]
  - id: extract_run_id
    type: STRING

tasks:
  - id: dbt_build_events
    type: io.kestra.plugin.dbt.cli.DbtCLI
    timeout: PT45M
    containerImage: "{{ kv('DBT_IMAGE') }}"
    projectDir: /app/analytics/dbt
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      user: root
      volumes:
        - "{{ kv('GCP_ADC_HOST_PATH') }}:/var/secrets/google/application_default_credentials.json:ro"
    env:
      DBT_GCP_PROJECT_ID: "{{ kv('GCP_PROJECT_ID') }}"
      DBT_RAW_DATASET: "{{ kv('BQ_RAW_DATASET') }}"
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
    commands:
      - "dbt build --select +{{ inputs.event_type }}"
    profiles: |
      equity_data_platform:
        outputs:
          dev:
            type: bigquery
            method: oauth
            project: "{{ kv('GCP_PROJECT_ID') }}"
            dataset: "{{ kv('BQ_ANALYTICS_DATASET') }}"
            location: "{{ kv('GCP_LOCATION') }}"
            threads: 4
        target: dev

errors:
  - id: log_transform_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "dbt failed for {{ inputs.event_type }} after extract {{ inputs.extract_run_id }}."
