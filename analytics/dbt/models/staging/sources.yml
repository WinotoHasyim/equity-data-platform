version: 2

sources:
  - name: equity_raw
    database: "{{ env_var('DBT_GCP_PROJECT_ID') }}"
    schema: "{{ env_var('DBT_RAW_DATASET') }}"
    tables:
      - name: daily_bars
        description: Append-only Alpaca daily-bar observations loaded from raw GCS batches.
      - name: alpaca_assets
        description: Append-only snapshots of Alpaca security reference metadata.
      - name: alpaca_trades
        description: Append-only historical trade events from the configured Alpaca feed.
      - name: alpaca_quotes
        description: Append-only historical Level 1 quote updates from the configured Alpaca feed.
      - name: sec_filings
        description: Append-only SEC EDGAR company filing metadata.
