id: daily_bars_load
namespace: equity.dev

description: Load one immutable GCS Parquet batch into the append-only BigQuery raw table.

inputs:
  - id: extract_run_id
    type: STRING

  - id: parquet_uri
    type: STRING

tasks:
  - id: load_raw_daily_bars
    type: io.kestra.plugin.gcp.bigquery.LoadFromGcs
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    location: "{{ kv('GCP_LOCATION') }}"
    from:
      - "{{ inputs.parquet_uri }}"
    destinationTable: "{{ kv('GCP_PROJECT_ID') }}.{{ kv('BQ_RAW_DATASET') }}.daily_bars"
    format: PARQUET
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_APPEND
    timePartitioningField: timestamp
    timePartitioningType: DAY
    clusteringFields:
      - symbol
      - feed

  - id: log_loaded_batch
    type: io.kestra.plugin.core.log.Log
    message: |
      Loaded extract run {{ inputs.extract_run_id }} into
      {{ outputs.load_raw_daily_bars.destinationTable }}
      Rows loaded: {{ outputs.load_raw_daily_bars.rows }}

outputs:
  - id: destination_table
    type: STRING
    value: "{{ outputs.load_raw_daily_bars.destinationTable }}"

  - id: loaded_rows
    type: INT
    value: "{{ outputs.load_raw_daily_bars.rows }}"
