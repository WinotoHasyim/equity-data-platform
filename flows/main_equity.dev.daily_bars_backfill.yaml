id: daily_bars_backfill
namespace: equity.dev

description: |
  Coordinate daily-bar extraction, raw loading, and canonical transformation
  with independent executions and retry boundaries for each phase.

concurrency:
  limit: 1

inputs:
  - id: start_date
    type: DATE
    description: Inclusive extraction start date.

  - id: end_date
    type: DATE
    description: Inclusive extraction end date.

  - id: symbols
    type: ARRAY
    itemType: STRING
    defaults:
      - AAPL
      - MSFT
      - NVDA
      - AMZN
      - META
    description: Company stock symbols to backfill.

tasks:
  - id: extract
    type: io.kestra.plugin.core.flow.Subflow
    namespace: equity.dev
    flowId: daily_bars_extract
    wait: true
    transmitFailed: true
    inputs:
      start_date: "{{ inputs.start_date }}"
      end_date: "{{ inputs.end_date }}"
      symbols: "{{ inputs.symbols }}"

  - id: load_and_transform_if_data
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.extract.outputs.has_parquet }}"
    then:
      - id: load
        type: io.kestra.plugin.core.flow.Subflow
        namespace: equity.dev
        flowId: daily_bars_load
        wait: true
        transmitFailed: true
        inputs:
          extract_run_id: "{{ outputs.extract.outputs.extract_run_id }}"
          parquet_uri: "{{ outputs.extract.outputs.parquet_uri }}"

      - id: transform
        type: io.kestra.plugin.core.flow.Subflow
        namespace: equity.dev
        flowId: daily_bars_transform
        wait: true
        transmitFailed: true
        inputs:
          extract_run_id: "{{ outputs.extract.outputs.extract_run_id }}"

  - id: log_backfill_complete
    type: io.kestra.plugin.core.log.Log
    message: |
      Backfill completed for {{ inputs.start_date }} through {{ inputs.end_date }}.
      Extract execution: {{ outputs.extract.executionId }}
      Manifest: {{ outputs.extract.outputs.manifest_uri }}

outputs:
  - id: extract_run_id
    type: STRING
    value: "{{ outputs.extract.outputs.extract_run_id }}"

  - id: manifest_uri
    type: STRING
    value: "{{ outputs.extract.outputs.manifest_uri }}"
