name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  dbt:
    name: dbt compile
    runs-on: ubuntu-latest
    env:
      DBT_GCP_PROJECT_ID: equity-data-platform-ci
      DBT_RAW_DATASET: equity_raw
      DBT_ANALYTICS_DATASET: equity_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Compile dbt project without warehouse introspection
        run: >-
          uv run dbt compile
          --project-dir dbt
          --profiles-dir .github/dbt
          --no-introspect
          --empty
