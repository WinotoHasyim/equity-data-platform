name: dbt CI

on:
  push:
    paths:
      - "analytics/dbt/**"
      - ".github/dbt/**"
      - ".github/workflows/dbt-ci.yml"
  pull_request:
    paths:
      - "analytics/dbt/**"
      - ".github/dbt/**"
      - ".github/workflows/dbt-ci.yml"

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    env:
      DBT_GCP_PROJECT_ID: equity-data-platform-ci
      DBT_GCP_LOCATION: asia-southeast2
      DBT_RAW_DATASET: equity_raw
      DBT_ANALYTICS_DATASET: equity_analytics
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: analytics/dbt/uv.lock
      - run: uv sync --project analytics/dbt --frozen
      - name: Parse dbt project without warehouse credentials
        run: >-
          uv run --project analytics/dbt dbt parse
          --project-dir analytics/dbt
          --profiles-dir .github/dbt
