name: Python CI

on:
  push:
    paths:
      - "ingestion/**"
      - "orchestration/kestra/scripts/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "ingestion/**"
      - "orchestration/kestra/scripts/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ingestion/uv.lock
      - run: uv sync --project ingestion --frozen
      - run: >-
          uv run --project ingestion ruff check
          ingestion/src ingestion/tests orchestration/kestra/scripts
      - run: uv run --project ingestion pytest -q ingestion/tests
